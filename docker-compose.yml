# Optional: local MongoDB as a single-node replica set (enables transactions,
# which the API uses when deleting a doctor together with their patients).
#   docker compose up -d
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      retries: 20
volumes:
  mongo-data:
